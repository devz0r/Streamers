[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamer"
version = "1.0.0"
description = "Weekly DST and Kicker streaming rankings for fantasy football, Vegas-anchored and self-calibrating."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "espn-api>=0.46",
    "yahoo-fantasy-api>=2.12",
    "yahoo-oauth>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
streamer = "streamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B905 (`zip(strict=)`) is excluded deliberately: most zips here pair a column
# list with a coefficient array of guaranteed equal length, and annotating
# every one adds noise without catching anything.
select = ["E", "F", "W", "UP", "B", "I"]
ignore = ["E501", "B905"]
