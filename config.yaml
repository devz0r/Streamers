# streamer — configuration
#
# Every scoring and season assumption lives here. Nothing in the model code
# hard-codes a scoring rule; `streamer.scoring` reads this file.
#
# Two league profiles are configured. Every command runs both by default;
# `--profile espn` or `--profile yahoo` narrows it. The published page carries
# both with a switch between them.
#
# Adding a third league needs nothing but another block under `profiles`: a
# name, a league size and two scoring sheets. The CLI choices, the page switch
# and the per-profile storage all follow from this file.

season:
  # Season currently being projected / published.
  current: 2026
  # Seasons used to train the historical prior.
  train_seasons: [2021, 2022, 2023, 2024, 2025]
  # Regular-season weeks only. Fantasy playoffs end week 17 in most leagues,
  # but we project the full regular season.
  max_regular_season_week: 18

# Profile used when --profile is not given.
default_profile: espn

# ---------------------------------------------------------------------------
# League scoring profiles
#
# Field-goal buckets are 0-39 / 40-49 / 50-59 / 60+ for both profiles. Yahoo
# does not distinguish 50-59 from 60+ (both score 5), and neither profile
# distinguishes inside 0-39, so the finest partition either league needs is
# what both are expressed in.
# ---------------------------------------------------------------------------
profiles:

  espn:
    name: "ESPN"
    description: "ESPN, 10-team"
    # Which platform `streamer sync` pulls this profile's league from. The
    # league id and cookies come from the environment (see README).
    league_sync:
      platform: espn
    league:
      teams: 10
      # A "startable" week: roughly one D/ST and one K per team, so the number
      # of managers who need a usable one each week.
      startable_rank: 12

    # Offensive scoring, used to turn sportsbook player props into fantasy
    # points. Both configured leagues are full PPR on the platform defaults.
    offense_scoring:
      pass_yards: 0.04          # 1 point per 25 yards
      pass_td: 4.0
      interception: -2.0
      rush_yards: 0.1          # 1 point per 10 yards
      rush_td: 6.0
      reception: 1.0
      reception_yards: 0.1
      reception_td: 6.0
      fumble_lost: -2.0
      two_point: 2.0

    kicker_scoring:
      fg_0_39: 3.0
      fg_40_49: 4.0
      fg_50_59: 5.0
      fg_60_plus: 6.0
      # ESPN's sheet exposes a single "Total Field Goals Missed" line at -1,
      # applied at every distance.
      fg_missed_0_39: -1.0
      fg_missed_40_49: -1.0
      fg_missed_50_59: -1.0
      fg_missed_60_plus: -1.0
      pat_made: 1.0
      pat_missed: -0.5

    dst_scoring:
      sack: 2.5
      interception: 2.5
      fumble_recovery: 2.0
      safety: 2.0
      one_point_safety: 1.0
      defensive_td: 6.0          # INT return TD, fumble return TD
      return_td: 6.0             # kickoff / punt return TD
      blocked_kick: 2.0          # blocked punt, PAT or FG
      blocked_kick_td: 6.0       # blocked kick returned for a TD
      extra_point_returned: 2.0  # 2pt return
      # Fumble lost by the D/ST unit itself: a muffed punt or kickoff return,
      # or a defender coughing it back up after a takeaway. NOT an offensive
      # fumble -- those belong to the offence, not this unit. Set to 0.0 if
      # your league's FUML line is the offensive one.
      fumble_lost: -2.0
      fourth_down_stop: 0.0      # not an ESPN scoring item
      points_allowed_tiers:
        - [0, 0, 6.0]
        - [1, 6, 4.0]
        - [7, 13, 3.0]
        - [14, 17, 1.0]
        # ASSUMPTION: 18-27 was absent from the supplied sheet. ESPN's default
        # for that band is 0, which is also the only value that keeps the
        # ladder monotonic between 14-17 (+1) and 28-34 (-1).
        - [18, 27, 0.0]
        - [28, 34, -1.0]
        - [35, 45, -3.0]
        - [46, null, -4.0]
      # ESPN also scores total yards allowed. Set to null for leagues that do
      # not (see the Yahoo profile).
      yards_allowed_tiers:
        - [0, 99, 5.0]
        - [100, 199, 3.0]
        - [200, 299, 2.0]
        - [300, 349, 1.0]
        - [350, 399, -1.0]
        - [400, 449, -2.0]
        - [450, 499, -3.0]
        - [500, 549, -4.0]
        - [550, null, -5.0]
      points_allowed_excludes_opponent_dst_st: false

  yahoo:
    name: "Yahoo"
    description: "Yahoo, 14-team"
    league_sync:
      platform: yahoo
    league:
      teams: 14
      startable_rank: 14

    # Offensive scoring, used to turn sportsbook player props into fantasy
    # points. Both configured leagues are full PPR on the platform defaults.
    offense_scoring:
      pass_yards: 0.04          # 1 point per 25 yards
      pass_td: 4.0
      interception: -2.0
      rush_yards: 0.1          # 1 point per 10 yards
      rush_td: 6.0
      reception: 1.0
      reception_yards: 0.1
      reception_td: 6.0
      fumble_lost: -2.0
      two_point: 2.0

    kicker_scoring:
      fg_0_39: 3.0
      fg_40_49: 4.0
      fg_50_59: 5.0
      fg_60_plus: 5.0
      # Yahoo's default sheet has no missed-field-goal penalty at all.
      fg_missed_0_39: 0.0
      fg_missed_40_49: 0.0
      fg_missed_50_59: 0.0
      fg_missed_60_plus: 0.0
      pat_made: 1.0
      pat_missed: 0.0

    dst_scoring:
      sack: 1.0
      interception: 2.0
      fumble_recovery: 2.0
      safety: 2.0
      one_point_safety: 0.0
      defensive_td: 6.0
      return_td: 6.0
      blocked_kick: 2.0
      blocked_kick_td: 6.0
      extra_point_returned: 2.0
      fumble_lost: 0.0           # not a Yahoo D/ST scoring item
      fourth_down_stop: 1.0      # Yahoo default: defensive stop on downs
      points_allowed_tiers:
        - [0, 0, 10.0]
        - [1, 6, 7.0]
        - [7, 13, 4.0]
        - [14, 20, 1.0]
        - [21, 27, 0.0]
        - [28, 34, -1.0]
        - [35, null, -4.0]
      yards_allowed_tiers: null
      points_allowed_excludes_opponent_dst_st: false

# ---------------------------------------------------------------------------
# Modelling
# ---------------------------------------------------------------------------
model:
  # Candidate estimators; the backtest picks the winner per position and the
  # choice is persisted to results/model_selection.json.
  candidates: [ridge, gbm]
  # Stage 1: the Vegas anchor. Lightly regularised on purpose -- this block is
  # the signal, not the noise, and shrinking it would only blunt the baseline
  # the adjustments are measured against.
  anchor_alpha: 1.0
  # Stage 2: the adjustment penalty. NOT hand-picked -- `streamer backtest
  # --tune --save` sweeps `ridge_alpha_grid` walk-forward and writes the winner
  # per position to results/model_selection.json, which overrides these seeds.
  # The values below are what that sweep selected on 2023-2025.
  ridge_alpha: 3000.0
  ridge_alpha_by_position:
    K: 10000.0
    DST: 3000.0
  ridge_alpha_grid: [30.0, 100.0, 300.0, 1000.0, 3000.0, 10000.0]
  gbm:
    max_iter: 300
    learning_rate: 0.05
    max_depth: 4
    min_samples_leaf: 40
    l2_regularization: 1.0
  # Current-season rows get this much more weight than historical rows during
  # the in-season refit, so the model tracks 2026 identity changes without
  # overreacting to a single week.
  current_season_weight: 2.0
  # Exponential decay applied per season of age on top of the above.
  season_decay: 0.85
  # Floor/ceiling are empirical residual quantiles from walk-forward residuals.
  floor_quantile: 0.15
  ceiling_quantile: 0.85
  # Monte-Carlo draws used for P(top-12).
  sim_draws: 4000
  # Minimum completed weeks of training data before a model will fit.
  min_train_rows: 400

# Bayesian shrinkage: how many league-average "pseudo-observations" a team or
# player carries before its own sample is trusted. Larger = slower to move.
shrinkage:
  # Team offence/defence rate stats. Per-position, because the two models want
  # different things and the backtest is unambiguous about it: D/ST ranking
  # improves markedly with a weak prior (real defensive identity -- especially
  # sack rate, the most stable D/ST signal -- survives instead of being washed
  # toward league average), while kicker ranking prefers a firmer prior because
  # team field-goal rates are noisier than they look. The rolling accumulator
  # already applies exponential decay, so this is shrinkage on top of that.
  team_rate_prior_games:
    DST: 1.0
    K: 6.0
  kicker_accuracy_prior_attempts: 25.0
  # Per-team in-season adjustment factors (sack rate, RZ stall, etc.) update
  # Bayesianly against the team's own multi-season prior with this weight.
  team_adjustment_prior_games: 8.0

# Factor-correlation ledger
ledger:
  trailing_weeks: 4
  # Prior strength (in team-week observations) of the historical correlation
  # when blending with current-season correlation. The prior's influence decays
  # automatically as the current-season sample grows: the blend is
  #   r = (n_cur * r_cur + k * r_hist) / (n_cur + k)
  prior_strength: 250.0
  # Feature weight multiplier = clip(|r_blend| / |r_hist|, lo, hi) ** gamma
  weight_gamma: 1.0
  weight_clip: [0.25, 3.0]

# ---------------------------------------------------------------------------
# Data sources
# ---------------------------------------------------------------------------
odds:
  # The Odds API free tier. Key read from ODDS_API_KEY in .env / environment.
  api_base: "https://api.the-odds-api.com/v4"
  sport: "americanfootball_nfl"
  regions: "us"
  markets: "spreads,totals"
  odds_format: "american"
  # Books to average, in preference order. Empty list = average all returned.
  bookmakers: []
  # Sportsbook player props -> implied fantasy points per player.
  #
  # COST, because this one bites: props are billed per market per region PER
  # EVENT. Only events with a startable player of yours are fetched, and
  # `max_events` caps it, so a run costs at most len(markets) x max_events =
  # 7 x 8 = 56 credits. The weekly job publishes twice a week, so about 480
  # credits a month -- just inside the 500 the free tier allows, and the page
  # prints the balance the API reports so it is not a guess. Lower
  # `max_events`, drop a market, or set `enabled: false` to spend less; a paid
  # plan makes the whole question go away.
  props:
    enabled: true
    # Books to average, in preference order. Pinnacle is the sharpest and is
    # weighted accordingly; the others fill in players Pinnacle does not post.
    # Caesars has appeared under both keys, so both are accepted.
    bookmakers: [pinnacle, fanduel, williamhill_us, caesars]
    bookmaker_weights:
      pinnacle: 2.0
    markets:
      - player_pass_yds
      - player_pass_tds
      - player_pass_interceptions
      - player_rush_yds
      - player_receptions
      - player_reception_yds
      - player_anytime_td
    # Only pull events with at least one startable player; 0 = the whole slate.
    max_events: 8
    # Books post props a day or two out, so a midweek request about Sunday
    # comes back empty. Events further away than this are not requested at
    # all, which is what keeps the midweek runs nearly free and concentrates
    # the spend on the Sunday-morning run, when the lineup is actually set.
    window_hours: 72
    # A prop line is the market's median. Converting it to a mean needs the
    # spread of that stat at that level: sd = intercept + slope x line,
    # floored. Fitted on 2021-2025 nflverse weekly stats, bucketing players by
    # their trailing-4 average (the level a book would be pricing) and taking
    # the sd of the actual result within each bucket. See DECISIONS.md.
    spread:
      passing_yards:         {intercept: 112.3, slope: -0.128, floor: 60.0}
      passing_tds:           {intercept: 1.01,  slope: 0.084,  floor: 0.8}
      passing_interceptions: {intercept: 0.80,  slope: 0.029,  floor: 0.7}
      rushing_yards:         {intercept: 15.3,  slope: 0.335,  floor: 8.0}
      receiving_yards:       {intercept: 15.1,  slope: 0.357,  floor: 8.0}
      receptions:            {intercept: 1.15,  slope: 0.277,  floor: 0.8}

  # Fallback chain, tried in order, first success wins:
  #   api      -> The Odds API (needs ODDS_API_KEY)
  #   csv      -> data/lines_week_N.csv (manual entry, see README)
  #   schedule -> nflverse schedule spread_line/total_line (closing lines)
  #   last     -> most recent cached pull for this week
  fallback_order: [api, csv, schedule, last]

weather:
  # Manual CSV override: data/weather_week_N.csv
  # Missing rows default to neutral (0 mph wind, no precipitation).
  default_wind_mph: 0.0
  default_temp_f: 60.0
  # Wind above this is treated as materially kicker-suppressing.
  high_wind_threshold: 15.0

paths:
  raw: data/raw
  results: results
  reports: reports
  docs: docs

# ---------------------------------------------------------------------------
# In-season roster tools (lineup, waivers, matchup)
# ---------------------------------------------------------------------------
roster:
  # Monte-Carlo draws per lineup evaluation. 20k keeps P(win) stable to ~0.5%.
  sims: 20000
  # Skill-position projection = blend of trailing production and trailing
  # opportunity-expected points (validated walk-forward, see DECISIONS.md),
  # scaled by the week's team implied total relative to its recent average.
  # `vegas_damping` is the exponent on that scale: 0 = ignore Vegas, 1 = full.
  vegas_damping: 0.5
  trailing_games: 4
  shrink_games: 3.0
  # The recent average is anchored to the player's own longer record: the
  # last `long_games` games, carrying `long_prior_games` games of weight.
  # Without it the model chased four-game streaks (calibration slope 0.89);
  # with it, slope 1.01 and better start/sit accuracy every season 2022-25.
  long_games: 17
  long_prior_games: 6.0
  # When the platform publishes its own projection, blend it with ours at this
  # weight. 0 = ours only, 1 = platform only.
  platform_projection_weight: 0.5
  # A Questionable/Doubtful player's projection is scaled by the chance they
  # play, and their spread widened to reflect the coin flip.
  questionable_play_probability: 0.75
  doubtful_play_probability: 0.25
  # Waiver moves below this blended gain in roster value (best-lineup points
  # plus replacement-level bench depth) are not shown.
  waiver_min_gain: 0.5
  # Skill projections are computed in full-PPR points (nflverse
  # fantasy_points_ppr). Both configured leagues are full PPR.
  scoring_basis: ppr

publish:
  site_title: "Streamer — DST & K Rankings"
  # Number of rows shown in the primary tables on the published page.
  top_n: 16
  # A unit qualifies as a 2-week stream hold if it ranks inside this cutoff
  # in BOTH the current week and the following week.
  two_week_rank_cutoff: 12
