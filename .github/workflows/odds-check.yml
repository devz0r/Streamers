# Does a model change make our odds worse? Plays a few replayed leagues per
# season (scripts/grade_league_odds.py) and fails if weekly P(win),
# P(playoffs) or P(title) Brier scores are worse than odds_baseline.json by
# more than the tolerance. Run it by hand after a change to the projections,
# the season model or the lineup draws; refresh the baseline with
# --write-baseline when a change is meant to move the scores.
name: odds-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STREAMER_CREDIT_FREE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      # The raw nflverse pulls the weekly run saved (this job only reads them).
      - name: Restore raw nflverse pulls
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: nflverse-none
          restore-keys: nflverse-
      - name: Replay leagues and check the odds
        run: python scripts/grade_league_odds.py --leagues 6 --weekly /tmp/weekly.pkl --check odds_baseline.json
