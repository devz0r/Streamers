name: weekly

# Tuesday: score the completed week, recalibrate, AND publish the next one --
#   the moment a week is over its recommendations are worthless, so the page
#   must not sit on them until Wednesday.
# Wednesday: publish again, once waivers have processed and lines have settled.
# Sunday early morning: publish once more before the early kickoffs -- this
#   is the run where sportsbook player props exist and the Friday injury
#   designations are in, so it is the one the lineup should be read from.
#   (Official inactives come 90 minutes before kickoff; no morning run can
#   know them.)
#
# Every step runs BOTH scoring profiles (ESPN and Yahoo) -- the CLI defaults to
# --profile all -- so each league gets its own calibration and both land on the
# one published page, switchable client-side.
#
# Times are UTC, and deliberately early and off the hour. GitHub treats a
# schedule as a request: runs queue behind everyone else's, most of all at
# the top of the hour, and this workflow's runs landed 3.5-4.5 hours late
# every time when it was set for 11:00 UTC. Scheduled at :17 past, hours
# ahead of when the page is wanted, the same delay still lands it early:
#   Tue/Wed 07:17 UTC = 03:17 ET (EDT) -> observed-delay worst case ~08:00 ET
#   Sun     08:17 UTC = 04:17 ET (EDT) -> worst case ~09:00 ET, ahead of the
#                                          09:30 ET London games and far
#                                          ahead of 13:00 ET kickoffs.
# In EST (from November) each is an hour earlier in ET.
#
# NOTE: GitHub runs scheduled workflows only from the repository's DEFAULT
# branch, and fails silently otherwise -- if this file lives on a non-default
# branch the cron never fires and nothing reports an error. Keep this project's
# branch as the default, or move the workflow when you change defaults.
on:
  schedule:
    - cron: "17 7 * * 2"   # Tuesday — score the week, publish the next
    - cron: "17 7 * * 3"   # Wednesday — rank + publish after waivers
    - cron: "17 8 * * 0"   # Sunday — republish with props and injury reports
    # Breaking news: a credit-free refresh every two hours through the US day
    # (08:41 ET to 00:41 ET), and hourly on Sundays from 09:11 ET while the
    # inactives come out. With GitHub's delays the exact times drift, but the
    # page stays within a few hours of the news; the Refresh link is instant.
    - cron: "41 0,2,4,12,14,16,18,20,22 * * *"
    - cron: "11 13-21 * * 0"
    # Night games: right after the inactives (about 90 minutes before the
    # 8:15/8:20 PM ET kickoffs on Thursday, Sunday and Monday), so the page
    # shows who is out and the fallback in time to make the swap. Two times
    # because cron is UTC: 22:55 is 6:55 PM EDT, 23:55 is 6:55 PM EST.
    - cron: "55 22,23 * * 0,1,4"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week to run (defaults to the auto-detected week)"
        required: false
        type: string
      job:
        description: "refresh = re-sync leagues and rebuild the page, spending no Odds API credits"
        required: false
        default: refresh
        type: choice
        options: [refresh, both, update, publish, yahoo-probe, fantasypros-probe, sleeper-probe, sgo-probe, news-probe, live-probe, live-check, timeline-probe, dstk-blend, wind-fit, sleeper-fit]

permissions:
  contents: write
  issues: write
  pages: write       # read how the site is served; deploy it when served from Actions
  id-token: write    # the deploy proves where it came from

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deploy.outputs.due }}
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # League sync (optional). ESPN needs the league id plus the two cookies
      # from a logged-in session; Yahoo needs an app and a refresh token from
      # `streamer yahoo-auth`. Missing credentials skip that league's sync
      # rather than failing the run.
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
      # Browser session for the Yahoo website, used because Yahoo no longer
      # provisions the developer API. The whole Cookie request header.
      YAHOO_COOKIE: ${{ secrets.YAHOO_COOKIE }}
      YAHOO_TEAM_ID: ${{ secrets.YAHOO_TEAM_ID }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # "legacy" = Pages serves the docs/ folder of the branch, so every page
      # rebuild is committed; "workflow" = Settings > Pages > Source: GitHub
      # Actions, so the page is deployed from this run and the files that
      # change on every run stay out of git (DECISIONS.md, "Publishing without
      # committing the page"). Until the setting is switched, nothing changes.
      - name: Find out how the site is served
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          echo "build_type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Pages build type: $TYPE"

      # The last run's team views, kept between runs: a game-day refresh
      # rebuilds only the views that changed (publish.read_me_cache).
      - name: Restore the team views
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/cache@v4
        with:
          path: docs/views
          key: views-${{ github.run_id }}
          restore-keys: views-

      - name: Cache raw nflverse pulls
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Work out which week to run
        id: week
        run: python scripts/current_week.py >> "$GITHUB_OUTPUT"
        env:
          STREAMER_WEEK_OVERRIDE: ${{ inputs.week }}

      - name: Decide which half to run
        id: mode
        run: |
          MODE="${{ inputs.job }}"
          if [ -z "$MODE" ] || [ "$MODE" = "both" ]; then
            case "${{ github.event.schedule }}" in
              "17 7 * * 2") MODE=both ;;
              "17 7 * * 3") MODE=publish ;;
              "17 8 * * 0") MODE=publish ;;
              "41 0,2,4,12,14,16,18,20,22 * * *") MODE=refresh ;;
              "11 13-21 * * 0") MODE=refresh ;;
              "55 22,23 * * 0,1,4") MODE=refresh ;;
              *)            MODE=both ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Diagnostic: describe Yahoo's pages so the cookie reader can be built
      # against their real structure. Prints no secrets and no page content.
      - name: Probe Yahoo pages
        if: steps.mode.outputs.mode == 'yahoo-probe'
        run: streamer yahoo-probe --detail --week "${{ steps.week.outputs.upcoming_week }}"

      - name: Probe the FantasyPros API
        if: steps.mode.outputs.mode == 'fantasypros-probe'
        run: streamer fantasypros-probe --week "${{ steps.week.outputs.upcoming_week }}"

      # Sleeper's free player database (no key): depth charts and injury
      # details. Public data; the probe prints counts and a few depth charts.
      # SportsGameOdds' NFL feed: which books, stat IDs and fields it carries.
      # Prints counts and names of fields, never prices, players or the key.
      - name: Probe SportsGameOdds
        if: steps.mode.outputs.mode == 'sgo-probe'
        run: streamer sgo-probe

      - name: Probe Sleeper's player database
        if: steps.mode.outputs.mode == 'sleeper-probe'
        run: streamer sleeper-probe

      # Free player news (ESPN's fantasy feed, Sleeper, Pro Football Rumors,
      # RotoWire): status, field names and a few public headlines. FantasyPros
      # is checked for status and field names only.
      - name: Probe player news
        if: steps.mode.outputs.mode == 'news-probe'
        run: streamer news-probe

      # Whether the page can read live NFL scores from ESPN in the browser
      # (CORS) and what the box score looks like: headers and shapes only.
      - name: Probe ESPN live scores
        if: steps.mode.outputs.mode == 'live-probe'
        run: python scripts/live_probe.py

      # What the injury-timeline reader made of a few players' news (public
      # news text only).
      - name: Probe injury timelines
        if: steps.mode.outputs.mode == 'timeline-probe'
        run: python scripts/timeline_probe.py

      # The page's live scoring (static/live.js) against a finished week:
      # agreement only, never a name or a score.
      - name: Check live scoring against last week
        if: steps.mode.outputs.mode == 'live-check'
        run: python scripts/live_check.py

      # Our D/ST and K rankings blended with the FantasyPros consensus, graded
      # on 2023-2025 (aggregates only; the consensus stays in data/raw).
      - name: Grade a consensus blend for D/ST and K
        if: steps.mode.outputs.mode == 'dstk-blend'
        run: streamer dstk-blend

      # Calibrate and test an Open-Meteo wind forecast for kickers against the
      # recorded wind and the stadium-typical wind, 2022-2025 (aggregates only
      # in the log; the runner can reach Open-Meteo, the development sandbox
      # cannot).
      - name: Calibrate and test the kicker wind forecast
        if: steps.mode.outputs.mode == 'wind-fit'
        run: python scripts/fit_wind_forecast.py

      # Sleeper's weekly projections against ours on 2023-2025 and this season.
      # The sandbox cannot reach api.sleeper.app, so this runs here; only
      # aggregates are printed.
      - name: Test Sleeper's weekly projections
        if: steps.mode.outputs.mode == 'sleeper-fit'
        run: python scripts/fit_sleeper_projections.py

      # --- Tuesday ---------------------------------------------------------
      # completed_week is 0 before any week has finished; there is nothing to
      # score then, and week 1 must not be scored before it is played.
      - name: Score last week and recalibrate
        if: |
          (steps.mode.outputs.mode == 'update' || steps.mode.outputs.mode == 'both')
          && steps.week.outputs.completed_week != '0'
        run: streamer update --week "${{ steps.week.outputs.completed_week }}"

      - name: Benchmark against Subvertadown
        if: |
          (steps.mode.outputs.mode == 'update' || steps.mode.outputs.mode == 'both')
          && steps.week.outputs.completed_week != '0'
        run: |
          WEEK="${{ steps.week.outputs.completed_week }}"
          # Either a shared file or a per-profile one is enough to run.
          if ls data/subvertadown_week_"${WEEK}"*.csv >/dev/null 2>&1; then
            streamer benchmark --week "$WEEK"
          else
            echo "No data/subvertadown_week_${WEEK}*.csv committed; skipping benchmark."
          fi

      # --- Wednesday -------------------------------------------------------
      # `rank` walks the odds fallback chain itself (API -> manual CSV ->
      # schedule closing lines -> last cached pull) and flags a degraded pull on
      # the page, so a missing or rate-limited key never blocks publishing.
      # Pull each league's rosters, free agents and matchup. The runner can
      # reach ESPN and Yahoo; a league whose secrets are absent is skipped.
      # A league that fails to sync (expired cookies, a revoked token) must not
      # stop the page: the step is marked as failed in the run summary, the
      # other league's snapshot is kept, and rank/publish carry on.
      # `refresh` (the default for a manual run, and what the page's Refresh
      # link starts) re-syncs rosters, lineups and the wire and rebuilds the
      # page without spending Odds API credits: game lines come from the last
      # pull and player props only from what earlier runs already bought.
      - name: Sync leagues
        id: sync
        if: contains(fromJSON('["publish", "both", "refresh"]'), steps.mode.outputs.mode)
        continue-on-error: true
        run: |
          set -o pipefail
          streamer sync --week "${{ steps.week.outputs.upcoming_week }}" --skip-missing 2>&1 | tee "$RUNNER_TEMP/sync.log"

      # The Yahoo cookie lapses every week or so and the Yahoo tab then goes
      # stale without a word. One open issue says so (the GitHub app pushes it
      # to a phone) and is closed again when a sync works. No secret is printed.
      - name: Tell me when the Yahoo sign-in has expired
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q "Yahoo session has expired" "$RUNNER_TEMP/sync.log" || exit 0
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Yahoo sign-in expired in:title" --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Yahoo sign-in expired" \
              --body "The Yahoo sync failed because the saved Cookie header no longer works, so the Yahoo tab is showing the last good sync. Copy a fresh Cookie header from a logged-in Yahoo fantasy page into the YAHOO_COOKIE secret (Settings, Secrets and variables, Actions). This issue closes itself when a sync works. First seen in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi

      - name: Close the Yahoo sign-in issue once a sync works
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Yahoo sign-in expired in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "A sync worked again, so the Yahoo sign-in is valid."
          done

      - name: Rank and publish the upcoming week
        if: contains(fromJSON('["publish", "both", "refresh"]'), steps.mode.outputs.mode)
        env:
          STREAMER_CREDIT_FREE: ${{ steps.mode.outputs.mode == 'refresh' && '1' || '' }}
        run: |
          WEEK="${{ steps.week.outputs.upcoming_week }}"
          streamer rank --week "$WEEK" --publish

      - name: Package the page
        id: package
        if: |
          steps.pages.outputs.build_type == 'workflow' &&
          contains(fromJSON('["publish", "both", "refresh"]'), steps.mode.outputs.mode) &&
          hashFiles('docs/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Note that a deploy is due
        id: deploy
        run: echo "due=${{ steps.package.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: Commit the refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.pages.outputs.build_type }}" = "workflow" ]; then
            # Deployed from this run: the page, its data and the team views are
            # not committed (a first run takes them out of git). Last week's
            # archive pages are, but only when the week is published, not on
            # every refresh.
            git rm -r -q --cached --ignore-unmatch docs/index.html docs/latest.json docs/views
            if [ "${{ steps.mode.outputs.mode }}" = "refresh" ]; then
              git add -A reports results data/leagues
              git checkout -- docs 2>/dev/null || true
            else
              git add -A docs reports results data/leagues
            fi
          else
            git add -A docs reports results data/leagues
          fi
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "weekly: refresh rankings (${{ steps.mode.outputs.mode }})"
            # Everything committed here is generated, so if another run
            # pushed first, this run's freshly built files win the conflict
            # (in a rebase, -X theirs means the commit being replayed).
            for attempt in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push failed (attempt $attempt); retrying"
              sleep $((2 ** attempt))
            done
            exit 1
          fi

  deploy:
    needs: weekly
    if: needs.weekly.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
