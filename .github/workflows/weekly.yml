name: weekly

# Tuesday: score the completed week, recalibrate, AND publish the next one --
#   the moment a week is over its recommendations are worthless, so the page
#   must not sit on them until Wednesday.
# Wednesday: publish again, once waivers have processed and lines have settled.
# Sunday early morning: publish once more before the early kickoffs -- this
#   is the run where sportsbook player props exist and the Friday injury
#   designations are in, so it is the one the lineup should be read from.
#   (Official inactives come 90 minutes before kickoff; no morning run can
#   know them.)
#
# Every step runs BOTH scoring profiles (ESPN and Yahoo) -- the CLI defaults to
# --profile all -- so each league gets its own calibration and both land on the
# one published page, switchable client-side.
#
# Times are UTC, and deliberately early and off the hour. GitHub treats a
# schedule as a request: runs queue behind everyone else's, most of all at
# the top of the hour, and this workflow's runs landed 3.5-4.5 hours late
# every time when it was set for 11:00 UTC. Scheduled at :17 past, hours
# ahead of when the page is wanted, the same delay still lands it early:
#   Tue/Wed 07:17 UTC = 03:17 ET (EDT) -> observed-delay worst case ~08:00 ET
#   Sun     08:17 UTC = 04:17 ET (EDT) -> worst case ~09:00 ET, ahead of the
#                                          09:30 ET London games and far
#                                          ahead of 13:00 ET kickoffs.
# In EST (from November) each is an hour earlier in ET.
#
# NOTE: GitHub runs scheduled workflows only from the repository's DEFAULT
# branch, and fails silently otherwise -- if this file lives on a non-default
# branch the cron never fires and nothing reports an error. Keep this project's
# branch as the default, or move the workflow when you change defaults.
on:
  schedule:
    - cron: "17 7 * * 2"   # Tuesday — score the week, publish the next
    - cron: "17 7 * * 3"   # Wednesday — rank + publish after waivers
    - cron: "17 8 * * 0"   # Sunday — republish with props and injury reports
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week to run (defaults to the auto-detected week)"
        required: false
        type: string
      job:
        description: "Which half to run"
        required: false
        default: both
        type: choice
        options: [both, update, publish, yahoo-probe]

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # League sync (optional). ESPN needs the league id plus the two cookies
      # from a logged-in session; Yahoo needs an app and a refresh token from
      # `streamer yahoo-auth`. Missing credentials skip that league's sync
      # rather than failing the run.
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
      # Browser session for the Yahoo website, used because Yahoo no longer
      # provisions the developer API. The whole Cookie request header.
      YAHOO_COOKIE: ${{ secrets.YAHOO_COOKIE }}
      YAHOO_TEAM_ID: ${{ secrets.YAHOO_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Cache raw nflverse pulls
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Work out which week to run
        id: week
        run: python scripts/current_week.py >> "$GITHUB_OUTPUT"
        env:
          STREAMER_WEEK_OVERRIDE: ${{ inputs.week }}

      - name: Decide which half to run
        id: mode
        run: |
          MODE="${{ inputs.job }}"
          if [ -z "$MODE" ] || [ "$MODE" = "both" ]; then
            case "${{ github.event.schedule }}" in
              "17 7 * * 2") MODE=both ;;
              "17 7 * * 3") MODE=publish ;;
              "17 8 * * 0") MODE=publish ;;
              *)            MODE=both ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Diagnostic: describe Yahoo's pages so the cookie reader can be built
      # against their real structure. Prints no secrets and no page content.
      - name: Probe Yahoo pages
        if: steps.mode.outputs.mode == 'yahoo-probe'
        run: streamer yahoo-probe --detail --week "${{ steps.week.outputs.upcoming_week }}"

      # --- Tuesday ---------------------------------------------------------
      # completed_week is 0 before any week has finished; there is nothing to
      # score then, and week 1 must not be scored before it is played.
      - name: Score last week and recalibrate
        if: |
          (steps.mode.outputs.mode == 'update' || steps.mode.outputs.mode == 'both')
          && steps.week.outputs.completed_week != '0'
        run: streamer update --week "${{ steps.week.outputs.completed_week }}"

      - name: Benchmark against Subvertadown
        if: |
          (steps.mode.outputs.mode == 'update' || steps.mode.outputs.mode == 'both')
          && steps.week.outputs.completed_week != '0'
        run: |
          WEEK="${{ steps.week.outputs.completed_week }}"
          # Either a shared file or a per-profile one is enough to run.
          if ls data/subvertadown_week_"${WEEK}"*.csv >/dev/null 2>&1; then
            streamer benchmark --week "$WEEK"
          else
            echo "No data/subvertadown_week_${WEEK}*.csv committed; skipping benchmark."
          fi

      # --- Wednesday -------------------------------------------------------
      # `rank` walks the odds fallback chain itself (API -> manual CSV ->
      # schedule closing lines -> last cached pull) and flags a degraded pull on
      # the page, so a missing or rate-limited key never blocks publishing.
      # Pull each league's rosters, free agents and matchup. The runner can
      # reach ESPN and Yahoo; a league whose secrets are absent is skipped.
      # A league that fails to sync (expired cookies, a revoked token) must not
      # stop the page: the step is marked as failed in the run summary, the
      # other league's snapshot is kept, and rank/publish carry on.
      - name: Sync leagues
        if: steps.mode.outputs.mode == 'publish' || steps.mode.outputs.mode == 'both'
        continue-on-error: true
        run: streamer sync --week "${{ steps.week.outputs.upcoming_week }}" --skip-missing

      - name: Rank and publish the upcoming week
        if: steps.mode.outputs.mode == 'publish' || steps.mode.outputs.mode == 'both'
        run: |
          WEEK="${{ steps.week.outputs.upcoming_week }}"
          streamer rank --week "$WEEK" --publish

      - name: Commit the refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs reports results data/leagues
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "weekly: refresh rankings (${{ steps.mode.outputs.mode }})"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push failed (attempt $attempt); retrying"
              sleep $((2 ** attempt))
            done
            exit 1
          fi
